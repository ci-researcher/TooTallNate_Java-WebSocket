name: Continuous Integration

on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '${{ matrix.java }}'
          distribution: 'temurin'
      - name: Maven Version
        run: mvn --version
      - name: Build
        run: mvn -DskipTests package --file pom.xml

    strategy:
      matrix:
        os: &id001
          - ubuntu-latest
          - windows-latest
          - macos-latest
        java:
          - 21
          - 25
      fail-fast: false
  Test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '${{ matrix.java }}'
          distribution: 'temurin'
      - name: Maven Version
        run: mvn --version
      - name: Test
        run: mvn test --file pom.xml
    strategy:
      matrix:
        os: *id001
        java:
          - 21
          - 25
      fail-fast: false
